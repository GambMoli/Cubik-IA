schema: spec-driven

# Cross-cutting rules for the whole monorepo. Component-specific rules live in
# backend/openspec/config.yaml and frontend/openspec/config.yaml, and their operating guides
# in backend/CLAUDE.md and frontend/CLAUDE.md. The root CLAUDE.md is the monorepo guide
# (layout, Moodle boundary, docker compose commands, environment and secrets rules).
# Use root-level changes only for work that spans components (e.g., a feature touching
# backend + frontend + Moodle LTI registration, docker compose, deployment).
context: |
  Cubik-IA is a monorepo: moodle/ (Aula Extendida, Moodle 4.5, never modified - integration
  only via LTI 1.3 / LTI Advantage and Web Services), backend/ (Python modular monolith,
  FastAPI), frontend/ (React + Vite + TypeScript, embedded in Moodle via LTI 1.3 iframe).
  The OpenAPI document generated by the backend is the contract between backend and frontend.
  Academic & business source of truth: documents under docs/ (Anteproyecto, IEEE 29148 SRS,
  student survey results, and faculty interview transcripts). Cite them by path and section.
  The SRS is the document "Requerimientos funcionales y no funcionales - Cubik IA": functional
  requirements RF-01..RF-14 and non-functional requirements RNF-01..RNF-09, each with a MoSCoW
  priority and a Gherkin scenario carrying a quantitative metric. Cite requirements by ID.
  All work goes through the OpenSpec flow (explore -> propose -> apply -> archive). No feature
  code is written outside an OpenSpec change with approved tasks.
  Users: Estudiante, Docente and Admin del sistema (RNF-03), all signed in from Aula Extendida
  through LTI 1.3 (RF-12, RNF-05).
  Subject scope: Cálculo Diferencial, Cálculo Integral y Métodos Numéricos (Cálculo I, II and V
  in the Anteproyecto), plus reinforcement of algebra foundations - factorización,
  simplificación y despeje (RF-04). Algebra-foundation queries are in scope, not off-syllabus.
  Pedagogical constraint: the assistant acts as a guided tutor (scaffolding/step-by-step),
  never as a direct homework solver that compromises academic integrity. The one sanctioned
  way to show a complete solution is RF-03: only after a recorded prior attempt by the student
  on that exercise and an explicit confirmation from the student (0% automatic releases).
  Likewise, OCR-digitized work is sent to evaluation only after the student explicitly
  confirms it (RF-14, 0% automatic submissions).
  Data protection (Ley 1581 de 2012): LTI user identifiers are pseudonymized at rest (keyed
  HMAC), PII is minimized and never written to logs. Visibility by role:
  - Estudiante: only their own history and results (RF-11, 0% cross-access).
  - Docente: identified per-student analytics and exports only for students enrolled in a course
    where the LTI launch gives them a teaching role (RF-08, RF-10); unit/topic analytics are
    aggregated (RF-09). Names shown to a docente are resolved from Moodle for that course
    (e.g., LTI NRPS) at request time, not stored by Cubik-IA.
  - Admin del sistema: operational data only; no access to student content by default.
  Quality targets (cite the ID; do not restate a different number):
  - RNF-01 availability: 99.5% during the academic-hours window (Monday to Sunday,
    06:00-23:00 America/Bogota, UTC-5) in the institutional academic periods; unplanned
    downtime <= 0.5% of the covered hours; scheduled maintenance is announced.
  - RNF-02 response time, P95 per operation category: simple read/write (RF-11, RF-14) 3 s;
    on-screen analytics (RF-08, RF-09) 4 s; export file generation (RF-10) 5 s; automatic
    evaluation per submission (RF-06) 26 s; mock-exam grading (RF-07) 27 s; OCR (RF-13) 56 s;
    complete LLM explanation or solution release (RF-01, RF-03) by exercise complexity -
    básico (<= 4 steps) 27 s, intermedio (5-8 steps) 28 s, avanzado (> 8 steps) 30 s.
    Responses from the LLM are streamed; the first-fragment target is RNF-02's.
  - RNF-03 security: TLS 1.2+ on 100% of communications; LTI 1.3 / OAuth 2.0 with JWT
    expiring in <= 1 h; 0 critical/high findings (OWASP Top 10) in the automated scan of a
    production deployment.
  - RNF-04 scalability: sustain 30 requests/s for 30 min (peaks of 50 requests/s) with RNF-02
    times met and <= 1% failed requests. Pilot: 30 students, 3 docentes, <= 5 concurrent users.
  - RNF-05 LTI sign-in: <= 3 s for 95% of attempts; >= 99.5% success over valid attempts.
  - RNF-06 grading: deterministic formula Nota = (aciertos / total de preguntas) x 5.0, rounded
    to 1 decimal, scale 0.0-5.0, aprobado when Nota >= 3.0; recalculation gives an identical
    result 100% of the time; each grade records the algorithm version. The LLM never decides
    a grade.
  - RNF-07 maintainability: >= 70% automated test coverage on critical components; a change
    reaches production through CI/CD in <= 15 min without affecting RNF-01.
  - RNF-08 compatibility: the two latest versions of Chrome, Firefox, Edge and Safari;
    viewport widths 360-1920 px.
  - RNF-09 disaster recovery: RPO <= 24 h (at least daily backups), RTO <= 4 h.
  - Accuracy: >= 85% correct answers in controlled tests (Anteproyecto, success criterion);
    OCR recognition >= 75% (RF-13).

rules:
  proposal:
    - Reference the requirement ID(s) (RF/RNF) or academic record(s) in docs/ that motivate the change (path + section), with the MoSCoW priority of each RF
    - State the pedagogical or operational outcome and which quality target(s) it affects (RNF-01..RNF-09, >= 85% accuracy, RF-13 OCR >= 75%)
    - State explicitly what is in scope and out of scope (Cálculo Diferencial, Cálculo Integral y Métodos Numéricos plus RF-04 algebra foundations; Aula Extendida Moodle boundary)
    - State which components are touched (backend, frontend, moodle config, infra) and, for cross-component work, which component-level changes it splits into
    - Keep it under 400 words
  specs:
    - Every requirement must trace to an RF/RNF ID of the SRS or to a record in docs/ (user research finding); requirements with no source are not added
    - Write scenarios in GIVEN/WHEN/THEN using realistic calculus queries, student step-by-step attempts or LTI 1.3 launch payloads
    - Every scenario that implements an RF/RNF carries that requirement's quantitative metric (time, percentage or count) with the same value as the SRS
    - Specify which student data each role (Estudiante, Docente, Admin) sees, following the visibility rules in context, and which PII fields are protected under Ley 1581 de 2012
    - For every operation, name its RNF-02 category and P95 target
  design:
    - For cross-component changes, include a Mermaid sequence diagram spanning Moodle -> frontend -> backend -> LLM/CAS, including at least one failure path
    - Name the OpenAPI contract changes and how backend and frontend roll them out without breaking each other
    - Describe infra impact (docker compose, Dockerfiles, Railway/Oracle deployment, environment variables) and how secrets are injected (environment variables only)
    - When a change adds or changes a persistent data store, describe its backup schedule and restore procedure against RNF-09 (RPO <= 24 h, RTO <= 4 h)
    - When a change exposes a service publicly, state how TLS 1.2+ (RNF-03) and health monitoring for RNF-01 are provided
    - Record decisions with the alternatives discarded and why
  tasks:
    - Split implementation into component-level changes when a change spans backend and frontend; root tasks cover only integration, infra and end-to-end verification
    - Include tasks to update docker compose, .env.example and docs/deploy-*.md when services, config or deployment change
    - Include backup and restore verification tasks when a change adds a persistent data store (RNF-09)
    - Final task is an end-to-end docker compose smoke check (Moodle LTI launch -> frontend -> backend health)

operations:
  apply:
    guidance:
      - Read the root CLAUDE.md and the CLAUDE.md of every component the change touches before starting
      - Implement only what the change's tasks describe; propose a change update for new scope
      - Report verification results faithfully, including failures
  archive:
    guidance:
      - Confirm all component-level changes are archived and the end-to-end smoke check passes
      - Summarize the outcome, traceability to the SRS requirement IDs (RF/RNF), and any follow-ups or known limitations
