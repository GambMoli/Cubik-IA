schema: spec-driven

# Stack, architecture, SOLID, testing, security and commands live in CLAUDE.md, which is
# loaded in every session. This file holds only what is specific to OpenSpec artifacts and
# operations, so the two never drift apart.
context: |
  CLAUDE.md is the project's operating guide and the source of truth for stack, architecture
  (microservices / clean architecture + SOLID), testing (TDD, unit, integration and load tests),
  security (LTI 1.3 / OAuth2 / JWT, Ley 1581 de 2012 PII anonymization) and Makefile commands.
  Every artifact must conform to it; a change that needs to deviate must say so explicitly in
  its proposal and design.
  Academic & business source of truth: documents under docs/ (Anteproyecto, IEEE 29148 SRS,
  student survey results, and faculty interview transcripts). Cite them by path and section.
  All work goes through the OpenSpec flow (explore -> propose -> apply -> archive). No feature
  code is written outside an OpenSpec change with approved tasks.
  Pedagogical constraint: the assistant must act as a guided tutor (scaffolding/step-by-step),
  never as a direct homework solver that compromises academic integrity.

rules:
  proposal:
    - Reference the requirement ID(s) (RF/RNF) or academic record(s) in docs/ that motivate the change (path + section)
    - State the pedagogical or operational outcome and how it maps to project quality metrics (e.g., >= 85% math accuracy, latency, uptime >= 99%)
    - State explicitly what is in scope and out of scope (respecting the Cálculo Diferencial, Cálculo Integral y Métodos Numéricos and Aula Extendida Moodle boundaries)
    - State whether the change touches the database schema and which expand/contract phase it is
    - Keep it under 400 words
  specs:
    - Every requirement must trace to a documented requirement in docs/ (IEEE 29148) or user research finding
    - Write scenarios in GIVEN/WHEN/THEN using realistic calculus queries (Diferencial, Integral, Métodos Numéricos), student step-by-step attempts, or LTI 1.3 launch payloads; each scenario must be directly translatable into an automated test
    - Cover failure and degraded paths, not only the happy path (invalid LaTeX/math syntax, out-of-syllabus query, LLM API timeout/fallback, invalid LTI signature -> 401, exam-mode restriction -> 403, rate limit -> 429)
    - Specify the classification of each processing step (deterministic/CAS validation, LLM-assisted scaffolding, LTI/LMS sync, docente-controlled rule)
    - Specify auth and role behavior for each endpoint (Estudiante vs. Docente vs. Admin; missing/invalid token -> 401)
    - Specify which student interaction fields are visible to the docente (aggregated/anonymized analytics) and which PII fields are protected under Ley 1581 de 2012
  design:
    - Map every component to a layer (presentation/Moodle LTI frontend, services, repositories, LLM adapters, schemas) and show that dependencies point inward
    - Name the Protocols each service depends on (especially the LLM provider interface for fallback resilience) and where they are wired (composition root)
    - Justify module boundaries with SOLID; call out any deliberate deviation and why
    - Database changes follow expand -> migrate -> contract with one Alembic revision per phase; expand is additive only, contract ships in a later change; never rename or drop in the same revision that introduces the replacement; every revision has a working downgrade and uses batch operations so it runs on both SQLite and PostgreSQL
    - Include a Mermaid sequence diagram for each main flow (Moodle LTI launch / chat request -> services -> LLM/repositories -> LaTeX response), covering at least one failure/fallback path
    - Include a Mermaid class diagram of the schemas, services, Protocols, and implementations introduced or changed; omit only when the change adds no classes
    - Define Pydantic schemas for every boundary and the HTTP contract (status codes, errors, LaTeX/step-by-step response structure)
    - Describe timeout, retry, caching, and fallback behavior for every external LLM API call
    - Describe how secrets/config are injected (environment variables only) and the LTI 1.3 / JWT auth design
    - List the OWASP API Security Top 10 (2023) / OWASP Top 10 (including LLM prompt injection) risks the change touches and the control for each; the change must not ship with an unaddressed one
    - State the test strategy - which behaviors are covered (unit, integration, and math accuracy benchmarks) and which fakes/mocks are used
    - Record decisions with the alternatives discarded and why
  tasks:
    - TDD - for every behavior, the failing test task comes before the implementation task
    - Order work by layer, inside out - schemas, services/adapters, repositories, presentation, wiring
    - Database tasks create an Alembic revision, state its expand/migrate/contract phase, and include a test that runs upgrade and downgrade on SQLite
    - Include tasks to update the Makefile, docker compose, and .env.example when commands, services, or config change
    - Keep each task small enough to finish and verify in under 30 minutes
    - Final task is verification - make check (linter + type/import checks + unit/integration tests) and a docker compose smoke check

operations:
  apply:
    guidance:
      - Read and follow CLAUDE.md before starting; it is the project's operating guide
      - Work test-first - write the test, run it and confirm it fails for the expected reason, then implement the minimum to pass, then refactor
      - Implement only what the change's tasks describe; propose a change update for new scope
      - Never edit an applied Alembic revision; add a new one
      - Run commands through the Makefile; report test results faithfully, including failures
  archive:
    guidance:
      - Confirm all tasks are done and make check passes before archiving
      - Update CLAUDE.md if the change introduced new commands, services, or conventions
      - Summarize the archive outcome, traceability to IEEE 29148 requirements, and any follow-ups or known limitations